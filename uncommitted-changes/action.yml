name: "Uncommitted Changes"
description:
  Fail if any uncommitted changes are detected.

inputs:
  files:
    default: 

runs:
  using: "composite"
  steps:
    - uses: tj-actions/verify-changed-files@7517b838f3a0d51de4b334a61ef1330672118927 # v14.0.2
      id: verify-changed-files
      with:
          files: ${{ inputs.files }}

    - name: List all changed files tracked and untracked files
      if: steps.verify-changed-files.outputs.files_changed == 'true'
      shell: bash
      run: |
        echo "::error title=🔴 Changed files:: ${{ steps.verify-changed-files.outputs.changed_files }}"
        git diff
        exit 1
