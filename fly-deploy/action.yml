name: "Fly Deploy"
description:
  Build the image with uv and Nix, push it to the app's registry on Fly
  and deploy it. Needs flyctl, skopeo, uv and nix-build, so run the nix
  action first.

inputs:
  app:
    description: Fly app name.
    required: true
  token:
    description: Fly API token that can deploy the app, and create it when org is given.
    required: true
  org:
    description: Create the app in this org when it does not exist yet. Leave empty for an app that must already exist.
    default:
  sha:
    description: Commit the image is built from. Tags the image and reaches the app as GIT_COMMIT.
    default: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
  secrets:
    description: KEY=VALUE lines to stage as app secrets before the deploy.
    default:
  project:
    description: Directory holding the pyproject.toml and uv.lock the image's venv is built from.
    default: .
  prebuild:
    description: Command to run before the venv is built, such as compiling a frontend.
    default:
  build:
    description: Command that builds the image in place of the uv and nix-build steps, leaving the same executable ./result. For projects that are not Python.
    default:
  strategy:
    description: >-
      How app Machines get the new image. "stop" cordons and stops them before deployment, then starts and uncordons them. "rolling" replaces them one at a time. "auto" compares incoming Alembic heads with the deployed PostgreSQL database, rolling when they match and stopping otherwise.
    default: auto
  alembic-config:
    description: Alembic config relative to project, used by strategy auto. Requires Alembic on the runner and psql plus DATABASE_URL on the deployed Machine (PostgreSQL, public.alembic_version).
    default: etc/production.ini

outputs:
  url:
    description: The app's fly.dev URL.
    value: https://${{ inputs.app }}.fly.dev

runs:
  using: "composite"
  steps:
    - name: Prepare the app
      if: ${{ inputs.prebuild != '' }}
      shell: bash
      run: ${{ inputs.prebuild }}

    - name: Build the image
      if: ${{ inputs.build != '' }}
      shell: bash
      run: ${{ inputs.build }}

    - name: Build the image
      if: ${{ inputs.build == '' }}
      shell: bash
      env:
        PROJECT: ${{ inputs.project }}
      run: |
        venv=$(mktemp -d)/venv
        uv venv --project "$PROJECT" --relocatable "$venv"
        project=$(uv version --project "$PROJECT" | cut -d" " -f1)
        UV_PROJECT_ENVIRONMENT="$venv" uv sync --project "$PROJECT" --frozen --no-dev --no-editable --reinstall-package "$project"
        nix-build -A image --arg venv "$venv"

    - name: Create the app when it does not exist
      if: ${{ inputs.org != '' }}
      shell: bash
      env:
        APP: ${{ inputs.app }}
        FLY_API_TOKEN: ${{ inputs.token }}
        ORG: ${{ inputs.org }}
      run: flyctl status -a "$APP" > /dev/null 2>&1 || flyctl apps create "$APP" --org "$ORG"

    - name: Push the image to the app's registry
      shell: bash
      env:
        APP: ${{ inputs.app }}
        FLY_API_TOKEN: ${{ inputs.token }}
        SHA: ${{ inputs.sha }}
      run: |
        ./result > "$RUNNER_TEMP/image.tar"
        skopeo --insecure-policy copy --retry-times 3 --dest-creds "x:$FLY_API_TOKEN" "docker-archive:$RUNNER_TEMP/image.tar" "docker://registry.fly.io/$APP:$SHA"

    - name: Stage the secrets
      if: ${{ inputs.secrets != '' }}
      shell: bash
      env:
        APP: ${{ inputs.app }}
        FLY_API_TOKEN: ${{ inputs.token }}
        SECRETS: ${{ inputs.secrets }}
      run: flyctl secrets import -a "$APP" --stage <<< "$SECRETS"

    - name: Select the strategy
      id: strategy
      shell: bash
      working-directory: ${{ inputs.project }}
      env:
        ACTION_PATH: ${{ github.action_path }}
        STRATEGY: ${{ inputs.strategy }}
        ALEMBIC_CONFIG: ${{ inputs.alembic-config }}
        APP: ${{ inputs.app }}
        FLY_API_TOKEN: ${{ inputs.token }}
      run: bash "$ACTION_PATH/strategy.sh"

    - name: Stop the app
      id: stop
      if: ${{ steps.strategy.outputs.strategy == 'stop' }}
      shell: bash
      env:
        APP: ${{ inputs.app }}
        FLY_API_TOKEN: ${{ inputs.token }}
      run: |
        # Leave release-command Machines alone; only manage the app Machines.
        machines=$(flyctl machine list -a "$APP" --json | jq '[.[] | select(.config.metadata.fly_process_group != "fly_app_release_command")]')
        for id in $(jq -r '.[].id' <<< "$machines"); do
          flyctl machine cordon "$id" -a "$APP"
        done
        while read -r id state; do
          if [[ "$state" != stopped ]]; then
            flyctl machine stop "$id" -a "$APP" --wait-timeout 1m
          fi
        done < <(jq -r '.[] | "\(.id) \(.state)"' <<< "$machines")

    - name: Deploy
      shell: bash
      env:
        APP: ${{ inputs.app }}
        FLY_API_TOKEN: ${{ inputs.token }}
        SHA: ${{ inputs.sha }}
        STRATEGY: ${{ steps.strategy.outputs.strategy }}
      run: |
        config=fly.toml
        if [[ -d backend ]]; then
          config=backend/fly.toml
        fi
        # With the Machines stopped flyctl's default strategy is as good as any;
        # running Machines are replaced one at a time.
        strategy=()
        if [[ "$STRATEGY" == rolling ]]; then
          strategy=(--strategy rolling)
        fi
        flyctl deploy --config "$config" -a "$APP" --image "registry.fly.io/$APP:$SHA" --ha=false "${strategy[@]}" -e "GIT_COMMIT=$SHA" -e "DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

    - name: Start the app
      # Once stopping was attempted, recover even if stopping or deployment failed.
      # The original failure/cancellation still determines the action's result.
      if: ${{ always() && steps.stop.outcome != 'skipped' }}
      shell: bash
      env:
        APP: ${{ inputs.app }}
        FLY_API_TOKEN: ${{ inputs.token }}
      run: |
        # Never restart a release-command Machine: it would rerun migrations.
        machines=$(flyctl machine list -a "$APP" --json | jq '[.[] | select(.config.metadata.fly_process_group != "fly_app_release_command")]')
        while read -r id state; do
          if [[ "$state" != started ]]; then
            flyctl machine start "$id" -a "$APP"
          fi
          flyctl machine wait "$id" -a "$APP" --state started --wait-timeout 1m
        done < <(jq -r '.[] | "\(.id) \(.state)"' <<< "$machines")
        for id in $(jq -r '.[].id' <<< "$machines"); do
          flyctl machine uncordon "$id" -a "$APP"
        done

    - name: Check the app
      shell: bash
      env:
        APP: ${{ inputs.app }}
      run: |
        echo "Waiting for the app to become ready ..."
        deadline=$((SECONDS + 60))
        for attempt in {0..12}; do
          if errors=$(curl --fail --silent --show-error --output /dev/null --max-time 10 "https://$APP.fly.dev" 2>&1); then
            echo "The app is ready."
            exit 0
          fi
          if (( attempt == 12 || SECONDS + 3 >= deadline )); then
            break
          fi
          echo "Retrying ..."
          sleep 3
        done
        echo "::error::The app did not become ready after deployment."
        printf '%s\n' "$errors"
        exit 1
