name: "Pause for debugging"
description:
  Hold the job open on a Niteo NixOS runner and print how to open a shell
  inside it

inputs:
  minutes:
    description:
      How long to wait for someone to attach. Short by default, because this
      is only the window for showing up and attaching stops the clock.
    default: "1"
  max_minutes:
    description:
      Backstop once someone has attached, so a forgotten debug session cannot
      hold a runner slot until the job's own timeout fires hours later.
    default: "60"

runs:
  using: "composite"
  steps:

    - name: Pause and say how to attach
      shell: bash
      env:
        HOLD_MINUTES: ${{ inputs.minutes }}
        MAX_MINUTES: ${{ inputs.max_minutes }}
      run: |
        HOLD="$RUNNER_TEMP/debug-hold"
        BOX="${RUNNER_NAME%%-*}"
        rm -f "$HOLD"

        # Whole numbers only. Anything else leaves the arithmetic below empty,
        # and the step would sail past without pausing at all.
        case "$HOLD_MINUTES" in ''|*[!0-9]*)
          echo "minutes must be a whole number, got '$HOLD_MINUTES'. Using 1."
          HOLD_MINUTES=1 ;;
        esac
        case "$MAX_MINUTES" in ''|*[!0-9]*)
          echo "max_minutes must be a whole number, got '$MAX_MINUTES'. Using 60."
          MAX_MINUTES=60 ;;
        esac

        UNIT=minutes
        [ "$HOLD_MINUTES" = "1" ] && UNIT=minute

        if [ -d /run/current-system ]; then
          cat <<EOF
        ==========================================================
         Waiting $HOLD_MINUTES $UNIT for someone to attach:

           ssh $BOX.niteo.co
           sudo /etc/nixos/debug-github-runner $RUNNER_NAME

         Attaching stops the clock, so take as long as you need once
         you are in. When you are done, let the job finish with:

           rm $HOLD

         The checkout is at:
           $GITHUB_WORKSPACE

         Nobody attaching within $HOLD_MINUTES $UNIT lets the job carry
         on by itself. Until then this slot cannot take other work.
        ==========================================================
        EOF
        else
          echo "Not a Niteo NixOS runner ($RUNNER_NAME), so there is no box to"
          echo "ssh into. Waiting $HOLD_MINUTES $UNIT anyway; touch $HOLD to hold"
          echo "the job, remove it to carry on."
        fi

        DEADLINE=$(( $(date +%s) + HOLD_MINUTES * 60 ))
        while [ "$(date +%s)" -lt "$DEADLINE" ]; do
          if [ -e "$HOLD" ]; then
            echo "Someone attached, so the countdown stops here."
            echo "The job resumes when $HOLD is removed (at the latest in $MAX_MINUTES minutes)."
            BACKSTOP=$(( $(date +%s) + MAX_MINUTES * 60 ))
            while [ -e "$HOLD" ] && [ "$(date +%s)" -lt "$BACKSTOP" ]; do
              sleep 5
            done
            if [ -e "$HOLD" ]; then
              echo "Still held after $MAX_MINUTES minutes, carrying on anyway."
            else
              echo "Released, carrying on."
            fi
            exit 0
          fi
          sleep 5
        done
        echo "Nobody attached within $HOLD_MINUTES $UNIT, carrying on."
