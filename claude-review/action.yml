name: "Claude review"
description:
  Review a pull request with Claude, leaving one review thread per problem.
  Claude approves once every thread it opened is resolved and it finds
  nothing new. Meant to run on every PR event; it skips drafts and commits
  it has nothing new to do for.

inputs:
  claude_code_oauth_token:
    description: Token from `claude setup-token`.
    required: true
  rules:
    description: Rules from teamniteo/claude to review against.
    default: "conventions backend frontend alembic"

runs:
  using: "composite"
  steps:
    # Fetched here rather than left to Claude: `gh pr view --comments` omits
    # the description, and whether a thread is resolved is only in GraphQL,
    # which Claude must not get (it could also resolve threads, approve and
    # merge). Not into .claude/: claude-code-action resets that to the base
    # branch.
    - name: Collect the PR's discussion and review threads
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        CONTEXT: ${{ runner.temp }}/review-context
      run: |
        mkdir -p "$CONTEXT/rules"
        gh pr view "$PR" --json title,body,comments,reviews > "$CONTEXT/pr.json"
        gh api graphql \
          -F owner='${{ github.repository_owner }}' \
          -F name='${{ github.event.repository.name }}' \
          -F pr="$PR" \
          -f query='
            query($owner: String!, $name: String!, $pr: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $pr) {
                  reviewThreads(first: 100) {
                    nodes {
                      isResolved
                      resolvedBy { login }
                      path
                      line
                      comments(first: 20) { nodes { author { login } body } }
                    }
                  }
                }
              }
            }' \
          --jq '[.data.repository.pullRequest.reviewThreads.nodes[]
                 | {resolved: .isResolved, resolved_by: .resolvedBy.login, path, line,
                    comments: [.comments.nodes[] | {author: .author.login, body}]}]' \
          > "$CONTEXT/review-threads.json"

    # Every PR event lands here, so most runs have nothing to do. Claude may
    # approve only once every thread it opened is resolved; until then it
    # doesn't get `gh pr review` at all, whatever the diff says.
    - name: Decide whether Claude has anything to do
      id: check
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        CONTEXT: ${{ runner.temp }}/review-context
      run: |
        read -r draft head < <(gh pr view "$PR" --json isDraft,headRefOid --jq '"\(.isDraft) \(.headRefOid)"')
        open=$(jq '[.[] | select(.comments[0].author == "claude" and (.resolved | not))] | length' \
          "$CONTEXT/review-threads.json")
        approved=$(gh api "repos/${{ github.repository }}/pulls/$PR/reviews?per_page=100" \
          --jq "[.[] | select(.user.login == \"claude[bot]\" and .state == \"APPROVED\" and .commit_id == \"$head\")] | length")
        reviewed=$(gh api "repos/${{ github.repository }}/commits/$head/status" \
          --jq '[.statuses[] | select(.context == "claude-review")] | length')

        if [ "$draft" = true ]; then
          skip="the PR is a draft"
        elif [ "$approved" -gt 0 ]; then
          skip="Claude already approved $head"
        elif [ "$reviewed" -gt 0 ] && [ "$open" -gt 0 ]; then
          skip="Claude already reviewed $head and $open of its threads are unresolved"
        fi

        echo "head=$head" >> "$GITHUB_OUTPUT"
        echo "open=$open" >> "$GITHUB_OUTPUT"
        if [ -n "${skip:-}" ]; then
          echo "Skipping: $skip"
          echo "run=false" >> "$GITHUB_OUTPUT"
        else
          echo "Reviewing $head; Claude's unresolved threads: $open"
          echo "run=true" >> "$GITHUB_OUTPUT"
        fi

    # CLAUDE_CODE_SUBPROCESS_ENV_SCRUB refuses to run without bubblewrap,
    # which claude-code-action only installs for allowed_non_write_users.
    - name: Install bubblewrap
      if: steps.check.outputs.run == 'true'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends bubblewrap socat
        # Ubuntu 24.04+ restricts unprivileged user namespaces via AppArmor.
        if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi

    # The dev shell links these from teamniteo/claude; a CI checkout has none.
    # Fetch them at the revision the project pins, or main if it pins none.
    - name: Fetch conventions
      if: steps.check.outputs.run == 'true'
      shell: bash
      env:
        RULES: ${{ inputs.rules }}
        CONTEXT: ${{ runner.temp }}/review-context
      run: |
        rev=$(jq -r '.nodes["niteo-claude"].locked.rev // "main"' nix/flake.lock 2>/dev/null || echo main)
        echo "teamniteo/claude@$rev: $RULES"
        for rule in $RULES; do
          curl -fsSL -o "$CONTEXT/rules/$rule.md" \
            "https://raw.githubusercontent.com/teamniteo/claude/$rev/rules/$rule.md"
        done

    - uses: anthropics/claude-code-action@86d88e619d8e6caf07b5c3944dd14f441c533718 # v1.0.243
      if: steps.check.outputs.run == 'true'
      env:
        # Keep the OAuth token out of the shell commands Claude runs.
        CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
      with:
        claude_code_oauth_token: ${{ inputs.claude_code_oauth_token }}
        prompt: |
          REPO: ${{ github.repository }}
          PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

          Review this pull request. Leave one inline comment per real problem,
          on the line it concerns, using
          mcp__github_inline_comment__create_inline_comment.
          ${{ steps.check.outputs.open == '0' && 'If you find nothing new, approve the PR with `gh pr review <number> --approve`, with no body, and post nothing else.' || format('{0} of the threads you opened earlier are still unresolved, so you cannot approve. If you find nothing new, post nothing.', steps.check.outputs.open) }}

          Before looking at the diff, read every file in
          ${{ runner.temp }}/review-context/ (rules/, pr.json and
          review-threads.json) and, if it exists, every file in
          .claude/skills-local/hindsight-review/.

          Context:
          - `gh pr diff <number>` is the diff. The checkout holds the whole
            codebase; read around the change when you need evidence.
          - ${{ runner.temp }}/review-context/pr.json has the title, the
            description, the comments and the review summaries. A decision
            made there (e.g. "we'll handle X in a follow-up") counts like a
            resolved thread. Ignore comments from bots, yourself included.
          - ${{ runner.temp }}/review-context/review-threads.json lists every
            review thread already on this PR.
            Don't raise a problem that any thread already covers, open or
            resolved: resolved means it was fixed, or a human decided not to
            fix it.

          What to check, one pass each:
          1. Conventions. For every changed file, tests included, go through
             each rule in the rules directory that applies to it (conventions.md
             for everything, backend.md for Python, frontend.md for Elm,
             alembic.md for migrations) and check the diff against it. Skip
             only what CI enforces: formatting, type checking, the coverage
             percentage, generated files, commit messages.
          2. If .claude/skills-local/hindsight-review/ exists, follow its
             SKILL.md, with three differences: the diff comes from
             `gh pr diff`, not git; only findings with evidence become inline
             comments; skip its report and its ❓ and ✓ entries.
          3. Bugs, swallowed errors and security problems.

          In each comment, name the convention or pattern the problem breaks.
          Skip style nits.
        # No `gh api`: Claude cannot resolve threads, push or merge. It gets
        # `gh pr review`, to approve, only once its threads are resolved.
        claude_args: >-
          --add-dir ${{ runner.temp }}/review-context
          --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep${{ steps.check.outputs.open == '0' && ',Bash(gh pr review:*)' || '' }}"

    # Lets the next event skip this commit while Claude's threads stay open,
    # and shows on the PR which commit Claude last looked at.
    - name: Mark the commit as reviewed
      if: steps.check.outputs.run == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh api -X POST "repos/${{ github.repository }}/statuses/${{ steps.check.outputs.head }}" \
          -f state=success -f context=claude-review -f description="Reviewed by Claude" >/dev/null
