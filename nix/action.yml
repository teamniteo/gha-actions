name: "Prepare nix-shell"
description:
  Download cache, build nix-shell and potentially upload any new
  derivations to cache

inputs:
  auth_token:
    required: true
  cache:
    default: niteo
  nix_path:
    description: >
      Nix search path. Defaults to nixpkgs=<repo root>/nix/default.nix, the
      root being `git rev-parse --show-toplevel`. Give a value to use it
      verbatim, or "" to leave NIX_PATH alone.
    default: auto
  push_filter:
    default:

runs:
  using: "composite"
  steps:

    - name: Figure out what kind of runner we are on
      shell: bash
      run: |
        if [ -n "$NSC_PROFILE_TAG" ]; then
          echo "NAMESPACE_RUNNER=1" >> $GITHUB_ENV
        fi
        if [ -d /run/current-system ]; then
          echo "NIXOS_RUNNER=1" >> $GITHUB_ENV
        fi

    - name: namespacelabs/nscloud-cache-action cannot mkdir /nix so we do it manually
      if: env.NAMESPACE_RUNNER
      shell: bash
      run: |
        sudo mkdir /nix
        sudo chown $USER /nix

    - uses: namespacelabs/nscloud-cache-action@v1.2.13
      if: env.NAMESPACE_RUNNER
      with:
        path: |
          /nix
          ~/.elm

    - name: Resolve nix_path
      id: nix_path
      shell: bash
      env:
        NIX_PATH_IN: ${{ inputs.nix_path }}
      run: |
        value="$NIX_PATH_IN"

        if [ "$value" = auto ]; then
          if ! root=$(git -C "$GITHUB_WORKSPACE" rev-parse --show-toplevel 2>/dev/null); then
            echo "::error::$GITHUB_WORKSPACE is not a git work tree, so the repo root cannot be found. Pass nix_path explicitly."
            exit 1
          fi
          value="nixpkgs=$root/nix/default.nix"
        fi

        if [ -n "$value" ] && [ ! -e "${value#*=}" ]; then
          echo "::error::nix_path '$value' does not exist, relative to $PWD"
          exit 1
        fi

        echo "value=$value" >> "$GITHUB_OUTPUT"

    - uses: cachix/install-nix-action@v27
      if: ${{ !env.NIXOS_RUNNER }}
      with:
        nix_path: ${{ steps.nix_path.outputs.value }}
        extra_nix_config: |
          system-features = kvm nixos-test

    - name: Set NIX_PATH on NixOS runners
      if: env.NIXOS_RUNNER
      shell: bash
      run: echo "NIX_PATH=${{ steps.nix_path.outputs.value }}" >> $GITHUB_ENV

    - uses: cachix/cachix-action@v17
      with:
        name: ${{ inputs.cache }}
        authToken: ${{ inputs.auth_token }}
        pushFilter: ${{ inputs.push_filter }}
        skipAddingSubstituter: ${{ env.NIXOS_RUNNER == '1' }}
        useDaemon: ${{ env.NIXOS_RUNNER != '1' }}

    - name: Enable KVM on namespace.so
      if: env.NAMESPACE_RUNNER
      shell: bash
      run: |
        sudo chmod 666 /dev/kvm
        echo "=== KVM Device Status ==="
        ls -la /dev/kvm || echo "/dev/kvm not found"
        [ -r /dev/kvm ] && [ -w /dev/kvm ] && echo "KVM is accessible" || echo "KVM is NOT accessible"
        echo ""
        echo "=== CPU Virtualization Support ==="
        grep -E 'vmx|svm' /proc/cpuinfo | head -1 | grep -oE 'vmx|svm' && echo "CPU supports virtualization" || echo "CPU does NOT support virtualization"

    # Build and evaluate the shell exactly once. nix print-dev-env realizes
    # the same derivations the old `nix-shell --run echo` warm-up built, and
    # additionally captures the resulting environment -- one step, both jobs.
    # The captured environment is offered to every later bash via BASH_ENV,
    # so there is no need for nix-shell evaluation in every step.
    - name: Evaluate the shell
      shell: bash
      run: |
        nix --extra-experimental-features 'nix-command flakes' \
          print-dev-env -f shell.nix > "$RUNNER_TEMP/nix-shell-env.bash"

        cat > "$RUNNER_TEMP/nix-shell-bash-env.bash" <<'WRAPPER'
        if [ -z "${IN_NIX_SHELL:-}" ]; then
          source "$RUNNER_TEMP/nix-shell-env.bash"
          export IN_NIX_SHELL="${IN_NIX_SHELL:-impure}"
        fi

        # GitHub's implicit step shell is `bash -e {0}`: errexit but no
        # pipefail, so a failure mid-pipeline is swallowed and only the last
        # command decides the step's exit status. Set last, so the sourced
        # environment cannot turn it back off.
        set -o pipefail
        WRAPPER

        # Prove it sources cleanly under the strict flags steps will use,
        # before any step depends on it.
        bash -eo pipefail -c '
          source "$RUNNER_TEMP/nix-shell-bash-env.bash"
          echo "shell environment sourced OK"
        '

        echo "BASH_ENV=$RUNNER_TEMP/nix-shell-bash-env.bash" >> "$GITHUB_ENV"

    # Report how long this job waited for a runner, for the box's Prometheus
    # metrics. Only the job itself can measure this: the queue is over by the
    # time the runner is handed the job, so the machine cannot observe it.
    #
    # Best effort throughout. This runs in every job on every NixOS runner, so
    # it must never be why a build goes red: no jq, no token permission or no
    # network all mean "log nothing" rather than "fail". The one condition
    # that gets a loud explanation is a 403, because that one is a fixable
    # workflow bug.
    - name: Record queue time for the runner metrics
      if: always() && env.NIXOS_RUNNER
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        {
          command -v jq > /dev/null || exit 0

          # The runner's PATH is extraPackages, which has jq and curl but not
          # util-linux. This step only runs on NixOS, so the system profile is
          # where logger definitely is.
          LOGGER=$(command -v logger || echo /run/current-system/sw/bin/logger)
          [ -x "$LOGGER" ] || exit 0

          RESP=$(curl -s --connect-timeout 5 --max-time 15 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -w $'\n%{http_code}' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100") || exit 0
          CODE="${RESP##*$'\n'}"
          BODY="${RESP%$'\n'*}"

          if [ "$CODE" = "403" ]; then
            echo "No queue time reported: the token lacks 'actions: read'."
            echo "A job-level permissions: block replaces the workflow-level one, so a"
            echo "job that declares its own permissions must repeat 'actions: read'."
            exit 0
          fi
          if [ "$CODE" != "200" ]; then
            echo "No queue time reported: HTTP $CODE from the jobs API"
            exit 0
          fi

          # Our own job is the one in progress on this runner: an ephemeral
          # runner only ever holds one job at a time
          LINE=$(jq -r --arg runner "$RUNNER_NAME" '
              .jobs[]
              | select(.runner_name == $runner and .status == "in_progress")
              | "job=\(.id) seconds=\((.started_at | fromdateiso8601) - (.created_at | fromdateiso8601))"
            ' <<< "$BODY" | head -1)

          if [ -n "$LINE" ]; then
            "$LOGGER" -t gha-queue "$LINE"
            echo "Waited ${LINE#*seconds=}s in the queue before $RUNNER_NAME picked this job up"
          else
            echo "No queue time reported: the API returned nothing for this runner"
          fi
        } || true
