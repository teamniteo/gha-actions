name: "Prepare nix-shell"
description:
  Download cache, build nix-shell and potentially upload any new
  derivations to cache

inputs:
  auth_token:
    required: true
  cache:
    default: niteo
  nix_path:
    default: nixpkgs=./nix/default.nix
  push_filter:
    default:

runs:
  using: "composite"
  steps:

    - name: Figure out what kind of runner we are on
      shell: bash
      run: |
        if [ -n "$NSC_PROFILE_TAG" ]; then
          echo "NAMESPACE_RUNNER=1" >> $GITHUB_ENV
        fi
        if [ -d /run/current-system ]; then
          echo "NIXOS_RUNNER=1" >> $GITHUB_ENV
        fi

    - name: namespacelabs/nscloud-cache-action cannot mkdir /nix so we do it manually
      if: env.NAMESPACE_RUNNER
      shell: bash
      run: |
        sudo mkdir /nix
        sudo chown $USER /nix

    - uses: namespacelabs/nscloud-cache-action@v1.2.13
      if: env.NAMESPACE_RUNNER
      with:
        path: |
          /nix
          ~/.elm

    - uses: cachix/install-nix-action@v27
      if: ${{ !env.NIXOS_RUNNER }}
      with:
        nix_path: ${{ inputs.nix_path }}
        extra_nix_config: |
          system-features = kvm nixos-test

    - name: Set NIX_PATH on NixOS runners
      if: env.NIXOS_RUNNER
      shell: bash
      run: echo "NIX_PATH=${{ inputs.nix_path }}" >> $GITHUB_ENV

    - uses: cachix/cachix-action@v17
      with:
        name: ${{ inputs.cache }}
        authToken: ${{ inputs.auth_token }}
        pushFilter: ${{ inputs.push_filter }}
        skipAddingSubstituter: ${{ env.NIXOS_RUNNER == '1' }}
        useDaemon: ${{ env.NIXOS_RUNNER != '1' }}

    - name: Enable KVM on namespace.so
      if: env.NAMESPACE_RUNNER
      shell: bash
      run: |
        sudo chmod 666 /dev/kvm
        echo "=== KVM Device Status ==="
        ls -la /dev/kvm || echo "/dev/kvm not found"
        [ -r /dev/kvm ] && [ -w /dev/kvm ] && echo "KVM is accessible" || echo "KVM is NOT accessible"
        echo ""
        echo "=== CPU Virtualization Support ==="
        grep -E 'vmx|svm' /proc/cpuinfo | head -1 | grep -oE 'vmx|svm' && echo "CPU supports virtualization" || echo "CPU does NOT support virtualization"

    - name: Build nix-shell
      shell: bash
      run: nix-shell --run "echo 'nix-shell successfully entered'"

