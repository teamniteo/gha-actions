name: Job cache tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/job-cache.yml'
      - 'job-cache/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/job-cache.yml'
      - 'job-cache/**'
permissions:
  actions: read
  contents: read
jobs:
  tests:
    name: Job cache tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - run: python3 -m unittest discover -s job-cache -p 'test_*.py'
  smoke:
    name: Job cache smoke (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: ./job-cache
        id: reuse
        with:
          check-name: Job cache smoke (${{ matrix.shard }}/2)
      - name: Produce a downstream artifact
        if: steps.reuse.outputs.skip != 'true'
        env:
          SHARD: ${{ matrix.shard }}
        run: echo "$SHARD" > "$RUNNER_TEMP/job-cache-output.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.reuse.outputs.skip != 'true'
        with:
          name: output_${{ github.event.pull_request.head.sha || github.sha }}_${{ matrix.shard }}
          path: ${{ runner.temp }}/job-cache-output.txt
      - name: Restore the original successful output
        if: steps.reuse.outputs.skip == 'true'
        uses: dawidd6/action-download-artifact@634d83b91986fcec9be314054943fa5c976aeb0e # v25
        with:
          run_id: ${{ steps.reuse.outputs.run-id }}
          name: output_${{ steps.reuse.outputs.head-sha }}_${{ matrix.shard }}
          path: ${{ runner.temp }}/restored
      - name: Verify the restored shard output
        if: steps.reuse.outputs.skip == 'true'
        env:
          SHARD: ${{ matrix.shard }}
        run: test "$(cat "$RUNNER_TEMP/restored/job-cache-output.txt")" = "$SHARD"
      - uses: ./job-cache
        if: steps.reuse.outputs.key != '' && steps.reuse.outputs.skip != 'true'
        with:
          mode: save
          key: ${{ steps.reuse.outputs.key }}
