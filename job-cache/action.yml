name: Decide whether a CI job should run
description: Decide and explain job execution using cached results, path filters, schedules and the full CI override.
inputs:
  mode:
    description: check before expensive steps, save as the final successful step.
    default: check
  check-name:
    description: Exact check name, including the matrix shard. Required in check mode.
    default: ''
  key:
    description: Key from check mode. Required in save mode.
    default: ''
  always-run:
    description: Always run this job, for example commit-message validation.
    default: 'false'
  filters:
    description: Optional path-filter YAML file or inline configuration.
    default: ''
  filter:
    description: Filter name for this job. Files must match an include and no exclusion.
    default: ''
  interval-days:
    description: Minimum days between successful executions. Zero disables the schedule.
    default: '0'
  interval-artifact:
    description: Repository-wide artifact name tracking actual scheduled executions. Required with interval-days.
    default: ''
outputs:
  reason:
    description: Human-readable explanation of the run or skip decision, also printed in logs.
    value: ${{ steps.decision.outputs.reason }}
  full:
    description: Whether the latest PR commit message contains [ci full]. Bypass path filters and other skip rules when true.
    value: ${{ steps.check.outputs.full }}
  skip:
    description: Whether expensive steps can be skipped, considering cached results and path filters.
    value: ${{ steps.decision.outputs.skip }}
  key:
    description: Key to pass to save mode after the job succeeds.
    value: ${{ steps.decision.outputs.key }}
  run-id:
    description: Original successful run, for restoring any outputs needed downstream.
    value: ${{ steps.check.outputs.run-id }}
  head-sha:
    description: Original successful run's head SHA, for finding commit-specific artifacts.
    value: ${{ steps.check.outputs.head-sha }}
runs:
  using: composite
  steps:
    - id: check
      if: inputs.mode == 'check'
      shell: bash
      env:
        ALWAYS_RUN: ${{ inputs.always-run }}
        CHECK_NAME: ${{ inputs.check-name }}
        GH_TOKEN: ${{ github.token }}
      run: python3 "$GITHUB_ACTION_PATH/cache.py" check
    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      id: paths
      if: inputs.mode == 'check' && inputs.always-run != 'true' && inputs.filter != '' && github.event_name == 'pull_request' && steps.check.outputs.skip != 'true' && steps.check.outputs.full != 'true'
      with:
        predicate-quantifier: some-with-excludes
        filters: ${{ inputs.filters }}
    - id: schedule
      if: inputs.mode == 'check' && inputs.always-run != 'true' && inputs.interval-days != '0' && steps.check.outputs.skip != 'true' && steps.paths.outputs[inputs.filter] != 'false'
      shell: bash
      env:
        INTERVAL_DAYS: ${{ inputs.interval-days }}
        INTERVAL_ARTIFACT: ${{ inputs.interval-artifact }}
        FULL: ${{ steps.check.outputs.full }}
        ALWAYS_RUN: ${{ inputs.always-run }}
        CHECK_NAME: ${{ inputs.check-name }}
        GH_TOKEN: ${{ github.token }}
      run: python3 "$GITHUB_ACTION_PATH/schedule.py"
    - id: decision
      if: inputs.mode == 'check'
      shell: bash
      env:
        ALWAYS_RUN: ${{ inputs.always-run }}
        CHECK_NAME: ${{ inputs.check-name }}
        FULL: ${{ steps.check.outputs.full }}
        CACHED_SKIP: ${{ steps.check.outputs.skip }}
        CACHE_KEY: ${{ steps.check.outputs.key }}
        SCHEDULE_SKIP: ${{ steps.schedule.outputs.skip }}
        PATH_MATCH: ${{ steps.paths.outputs[inputs.filter] }}
      run: python3 "$GITHUB_ACTION_PATH/decision.py"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: inputs.mode == 'save' && inputs.key != ''
      continue-on-error: true
      with:
        name: ${{ inputs.key }}
        path: ${{ runner.temp }}/job-cache-marker.txt
        overwrite: true
    - if: inputs.mode == 'save' && inputs.key != ''
      shell: bash
      env:
        CACHE_KEY: ${{ inputs.key }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: python3 "$GITHUB_ACTION_PATH/cache.py" save
    - if: inputs.mode == 'save' && inputs.interval-days != '0'
      shell: bash
      run: date -u +%Y-%m-%dT%H:%M:%SZ > "$RUNNER_TEMP/job-cache-interval.txt"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: inputs.mode == 'save' && inputs.interval-days != '0'
      continue-on-error: true
      with:
        name: ${{ inputs.interval-artifact }}
        path: ${{ runner.temp }}/job-cache-interval.txt
        overwrite: true
