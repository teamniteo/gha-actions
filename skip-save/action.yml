name: Save a successful CI execution
description: Record successful job results and scheduled executions after expensive steps finish.
inputs:
  config:
    description: Checkout-relative YAML policy file, matching the skip action.
    default: .github/skip.yml
runs:
  using: composite
  steps:
    - id: config
      shell: bash
      env:
        POLICY_FILE: ${{ inputs.config }}
        MATRIX_JSON: ${{ toJSON(matrix) }}
      run: |
        source "$GITHUB_ACTION_PATH/../skip/setup-python.sh"
        "$GHA_SKIP_PYTHON" "$GITHUB_ACTION_PATH/../skip/config.py"

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: env.GHA_SKIP_KEY != ''
      continue-on-error: true
      with:
        name: ${{ env.GHA_SKIP_KEY }}
        path: ${{ runner.temp }}/job-cache-marker.txt
        overwrite: true
    - if: env.GHA_SKIP_KEY != ''
      shell: bash
      env:
        CACHE_KEY: ${{ env.GHA_SKIP_KEY }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: python3 "$GITHUB_ACTION_PATH/../skip/cache.py" save
    - if: steps.config.outputs.interval-artifact != ''
      shell: bash
      run: date -u +%Y-%m-%dT%H:%M:%SZ > "$RUNNER_TEMP/job-cache-interval.txt"

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: steps.config.outputs.interval-artifact != ''
      continue-on-error: true
      with:
        name: ${{ steps.config.outputs.interval-artifact }}
        path: ${{ runner.temp }}/job-cache-interval.txt
        overwrite: true
